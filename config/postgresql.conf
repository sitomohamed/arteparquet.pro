# ══════════════════════════════════════════════════════════════════════════════
# PostgreSQL Security-Hardened Configuration
# For Arteparquet Production Environment
# ══════════════════════════════════════════════════════════════════════════════

# ═══════════════════════════════════════════════════════════════════════════════
# CONNECTION & AUTHENTICATION
# ═══════════════════════════════════════════════════════════════════════════════

# Listen only on container network, not public interfaces
listen_addresses = 'localhost,db'
port = 5432

# Maximum connections - limit to prevent DoS
max_connections = 50

# Authentication timeout
authentication_timeout = 30s

# Password encryption - use strongest available
password_encryption = scram-sha-256

# ═══════════════════════════════════════════════════════════════════════════════
# SSL/TLS (Enable if certificates are configured)
# ═══════════════════════════════════════════════════════════════════════════════

# ssl = on
# ssl_cert_file = '/etc/postgresql/server.crt'
# ssl_key_file = '/etc/postgresql/server.key'
# ssl_min_protocol_version = 'TLSv1.2'
# ssl_prefer_server_ciphers = on

# ═══════════════════════════════════════════════════════════════════════════════
# LOGGING - Security Monitoring
# ═══════════════════════════════════════════════════════════════════════════════

# Enable logging
logging_collector = on
log_directory = '/var/log/postgresql'
log_filename = 'postgresql-%Y-%m-%d.log'
log_rotation_age = 1d
log_rotation_size = 100MB

# What to log
log_connections = on
log_disconnections = on
log_statement = 'ddl'  # Log all DDL (CREATE, ALTER, DROP)
log_duration = off
log_min_duration_statement = 5000  # Log queries taking > 5 seconds

# Log format
log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '

# ═══════════════════════════════════════════════════════════════════════════════
# RESOURCE LIMITS
# ═══════════════════════════════════════════════════════════════════════════════

# Memory
shared_buffers = 128MB
work_mem = 4MB
maintenance_work_mem = 64MB

# Statement timeout (prevent long-running queries)
statement_timeout = 60000  # 60 seconds

# Lock timeout
lock_timeout = 10000  # 10 seconds

# Idle transaction timeout
idle_in_transaction_session_timeout = 300000  # 5 minutes

# ═══════════════════════════════════════════════════════════════════════════════
# SECURITY SETTINGS
# ═══════════════════════════════════════════════════════════════════════════════

# Prevent privilege escalation
row_security = on

# Restrict function creation to trusted languages
# (requires superuser to change)

# ═══════════════════════════════════════════════════════════════════════════════
# PERFORMANCE (basic tuning)
# ═══════════════════════════════════════════════════════════════════════════════

effective_cache_size = 256MB
random_page_cost = 1.1
